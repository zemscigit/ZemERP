services:
  mysql:
    image: mysql:8.0
    container_name: zemerp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zemerp
      MYSQL_USER: zemerp
      MYSQL_PASSWORD: zemerp
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./docker/app
    container_name: zemerp_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      # vendor อยู่ใน named volume เพื่อเลี่ยง bind mount (Windows) ที่ช้ามาก
      - app_vendor:/var/www/vendor
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction &&
             cp -n .env.example .env || true &&
             php artisan key:generate --force &&
             php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

volumes:
  mysql_data:
  app_vendor:
